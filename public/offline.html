<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffdfb">
<title>Babji tracker</title>
<style>
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #faf9f7; color: #292b34; font: 17px system-ui, sans-serif; }
  main { max-width: 24rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.5rem; }
  p { line-height: 1.55; }
  button { min-height: 44px; padding: 0 1rem; border: 0; border-radius: 10px; background: #69599f; color: white; font: inherit; cursor: pointer; }
</style>
<main>
  <span aria-hidden="true">🍼</span>
  <h1>Babji tracker</h1>
  <p>目前没有网络连接。重新联网后再打开宝宝记录。</p>
  <p lang="en">You’re offline. Reconnect to open your baby tracker.</p>
  <button onclick="location.reload()">重试 <span lang="en">/ Retry</span></button>
</main>
